[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blunit-fx-netter"
version = "0.1.0"
description = "Blunit FX Internalizer - Proof of Concept for EUR/CZK Internal Market Maker"
authors = [{ name = "Blunit Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = ["pandas>=2.0.0"]
test = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
